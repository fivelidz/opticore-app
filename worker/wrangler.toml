name = "opticore-booking"
main = "src/index.js"
compatibility_date = "2024-09-01"

# D1 database for booking queue + published availability
[[d1_databases]]
binding = "DB"
database_name = "opticore-bookings"
database_id = "opticore-bookings-dev"

# KV for rate limiting / session
[[kv_namespaces]]
binding = "KV"
id = "opticore-kv-dev"

# Environment variables (set via wrangler secret for production)
[vars]
CLINIC_NAME = "OptiCore"
TENANT_ID = "default"
