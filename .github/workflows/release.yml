name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi,nsis"
            artifact: "OptiCore_*_x64*.msi"
            name: "Windows MSI"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            artifact: "OptiCore*_aarch64.dmg"
            name: "macOS Apple Silicon"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
            artifact: "OptiCore*_x64.dmg"
            name: "macOS Intel"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            artifact: "OptiCore*.deb"
            name: "Linux deb"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend deps
        run: npm --prefix frontend install

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "OptiCore ${{ github.ref_name }}"
          releaseBody: "OptiCore Practice Management System. Download the installer for your platform below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
