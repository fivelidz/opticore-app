[package]
name = "server"
version.workspace = true
edition.workspace = true

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "pms-server"
path = "src/main.rs"

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
# Pull libsqlite3-sys directly so the SQLCipher feature is activated for the
# SQLite that sqlx bundles. (Without this, sqlx's own `bundled` feature wins
# and plain SQLite is compiled — the `key` pragma is then silently ignored.)
libsqlite3-sys.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
jsonwebtoken.workspace = true
argon2.workspace = true
rand.workspace = true
once_cell.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# jsonwebtoken + chrono are regular deps; re-declared here so integration
# tests can craft custom tokens (expired, wrong-key, etc.) for auth edge-case
# coverage. Using the workspace dep avoids version skew.
jsonwebtoken.workspace = true
chrono.workspace = true

[build-dependencies]
# none
